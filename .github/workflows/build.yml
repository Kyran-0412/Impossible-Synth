name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine test (renders demo sounds)
        shell: bash
        run: |
          mkdir -p demo-sounds
          ./build/Release/render_test.exe demo-sounds

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Impossible-Synth-Windows
          path: |
            build/ImpossibleSynth_artefacts/Release/VST3/
            build/ImpossibleSynth_artefacts/Release/Standalone/*.exe

      - name: Upload demo sounds
        uses: actions/upload-artifact@v5
        with:
          name: Demo-Sounds
          path: demo-sounds/*.wav

      # pluginval loads the plugin like a DAW would and stress-tests it.
      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --validate "build/ImpossibleSynth_artefacts/Release/VST3/Impossible Synth.vst3" 2>&1 | Tee-Object -FilePath pluginval-logs/pluginval.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface failures as annotations so they're visible without opening the log.
            $lines = Get-Content pluginval-logs/pluginval.txt
            $lines | Select-String -Pattern 'FAILED|!!!' -Context 3,3 | Select-Object -First 8 | ForEach-Object {
              $text = (($_.Context.PreContext + $_.Line + $_.Context.PostContext) -join '%0A')
              Write-Output "::error title=pluginval::$text"
            }
            $tail = ($lines | Select-Object -Last 40) -join '%0A'
            Write-Output "::warning title=pluginval log tail::$tail"
            exit 1
          }

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pluginval-log
          path: pluginval-logs/
          if-no-files-found: ignore
